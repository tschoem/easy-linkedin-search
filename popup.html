<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Easy LinkedIn Search</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" width="28" height="28" />
      <div>
        <h1>Easy LinkedIn Search</h1>
        <p>Contacts across apps → LinkedIn</p>
      </div>
    </header>

    <label class="row master">
      <div>
        <strong>Enable extension</strong>
        <span>Master switch for LinkedIn icons</span>
      </div>
      <input type="checkbox" id="enabled" />
    </label>

    <fieldset id="apps">
      <legend>Apps</legend>

      <label class="row">
        <div>
          <strong>Google Calendar</strong>
          <span>Icons next to event guests</span>
        </div>
        <input type="checkbox" id="app-calendar" data-app="calendar" />
      </label>

      <label class="row">
        <div>
          <strong>Gmail</strong>
          <span>Icons next to senders and recipients</span>
        </div>
        <input type="checkbox" id="app-gmail" data-app="gmail" />
      </label>

      <label class="row">
        <div>
          <strong>HubSpot</strong>
          <span>Icons on contact cards and lists</span>
        </div>
        <input type="checkbox" id="app-hubspot" data-app="hubspot" />
      </label>
    </fieldset>

    <fieldset id="filters">
      <legend>Skip domains</legend>
      <label class="stack">
        <strong>Excluded email domains</strong>
        <span>No icons for these addresses. Separate with commas or new lines.</span>
        <textarea
          id="excludedDomains"
          rows="3"
          placeholder="gmail.com&#10;yahoo.com"
          spellcheck="false"
        ></textarea>
      </label>
    </fieldset>

    <fieldset id="features">
      <legend>On icon click</legend>

      <label class="row">
        <div>
          <strong>Side window</strong>
          <span>Resize the app and open LinkedIn beside it</span>
        </div>
        <input type="radio" name="clickTarget" value="sidePanel" />
      </label>

      <label class="row">
        <div>
          <strong>New tab</strong>
          <span>Open LinkedIn search in a new browser tab</span>
        </div>
        <input type="radio" name="clickTarget" value="newTab" />
      </label>
    </fieldset>

    <p class="hint" id="status" aria-live="polite"></p>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
